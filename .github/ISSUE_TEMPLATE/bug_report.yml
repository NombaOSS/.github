name: Bug report
description: Something in this project doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Don't include API keys, client secrets, account IDs or customer data. For security problems, see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of this package you're using.
      placeholder: e.g. 0.1.2
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Language runtime and version, and your OS.
      placeholder: e.g. Node 22 on macOS, Python 3.12 on Ubuntu, PHP 8.3
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Nomba environment
      options:
        - Sandbox
        - Production
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The full error, with any secrets removed.
      render: text
