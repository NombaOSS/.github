name: Feature request
description: Suggest an improvement or a missing API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Code sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
